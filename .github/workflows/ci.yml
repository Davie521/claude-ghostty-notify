name: CI

# macOS-only plugin, so CI runs on macOS: the hooks target /bin/bash 3.2 and
# BSD userland (stat -f, BSD date/find), which a Linux runner would not catch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck and jq
        run: |
          command -v shellcheck >/dev/null 2>&1 || brew install shellcheck
          command -v jq >/dev/null 2>&1 || brew install jq
          shellcheck --version | sed -n '1,2p'
          jq --version

      - name: Bash syntax check
        run: |
          for f in hooks/*.sh install.sh tests/*.sh scripts/*.sh; do
            bash -n "$f" && echo "  ok  $f"
          done

      - name: ShellCheck
        # --severity=warning skips info/style noise (e.g. SC1003 on the
        # intentional OSC 2 String Terminator) while still failing on any
        # warning or error.
        run: shellcheck --severity=warning hooks/*.sh install.sh tests/*.sh scripts/*.sh

      - name: Validate JSON
        run: |
          for j in hooks/hooks.json example-settings.json .claude-plugin/*.json; do
            jq empty "$j" && echo "  ok  $j"
          done

      - name: Regression tests
        run: |
          bash tests/test-alerter-dispatch.sh
          bash tests/test-fallback-no-focus.sh
          bash tests/test-session-title.sh
          bash tests/test-clear-on-focus.sh

      # The native watcher is optional at runtime — every step above pins the
      # bash path, so a Swift failure here can never mask a shell regression.
      - name: Swift toolchain
        run: swift --version

      - name: Build native watcher
        # -c release is required: tests/test-swift-watcher.sh resolves the
        # binary under .build/release, and --package-path is required because
        # the package lives in a subdirectory.
        run: swift build -c release --package-path watcher

      - name: WatcherCore unit tests
        run: swift test --package-path watcher

      - name: Native watcher integration test
        run: bash tests/test-swift-watcher.sh
